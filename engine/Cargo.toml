[package]
name = "aura-engine"
version = "0.1.0"
edition = "2021"
description = "Сетевой движок Aurora VPN на Rust: понимает конфиг и Clash API sing-box"
license = "MIT"

[lib]
name = "aura_engine"
path = "src/lib.rs"

[[bin]]
name = "aura-engine"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
parking_lot = "0.12"
socket2 = { version = "0.6", features = ["all"] }
base64 = "0.22"
rand = "0.8"

# Криптография. ring — быстрые AEAD и HKDF на ассемблере, dalek нужен ради
# REALITY: один и тот же эфемерный ключ участвует в двух ECDH, а ring отдаёт
# его только на один.
ring = "0.17"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ml-kem = "0.2"
sha2 = "0.10"
sha3 = "0.10"
md-5 = "0.10"
aes = "0.8"
crc32fast = "1"
fnv = "1"
blake2 = "0.10"

# Свой TLS 1.3 для uTLS/REALITY проверяет цепочку через webpki; rustls остаётся
# запасным путём для серверов только с TLS 1.2 и основой QUIC.
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["std", "ring"] }
webpki-roots = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
h3 = "0.0.8"
h3-quinn = "0.0.10"
bytes = "1"
http = "1"

brotli-decompressor = "5"
flate2 = "1"
regex-lite = "0.1"

[target.'cfg(windows)'.dependencies]
wintun = "0.5"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Networking_WinSock",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_NetworkManagement_WindowsFilteringPlatform",
  "Win32_System_Rpc",
  "Win32_System_Threading",
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
# Именно unwind, не abort: паника разбора чужих байтов остаётся внутри задачи
# одного соединения. Процесс sing-box умирал от typed-nil целиком, этот не должен.
panic = "unwind"

[profile.dev]
opt-level = 1
