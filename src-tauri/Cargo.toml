[package]
name = "aurora-vpn"
# Placeholder — the app version users see lives in ../package.json;
# tauri.conf.json points its `version` field there.
version = "0.0.0"
description = "VPN client for VLESS, VMess, Trojan, Shadowsocks, Hysteria2 and TUIC servers, powered by sing-box"
authors = ["Aurora VPN"]
edition = "2021"
rust-version = "1.82"

[lib]
# `_lib` suffix keeps the desktop binary and the mobile cdylib from colliding.
name = "aurora_vpn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2.7"
tauri-plugin-opener = "2.5"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
parking_lot = "0.12"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "time",
  "process",
  "io-util",
  "sync",
  "net",
] }
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.23"
url = "2"
percent-encoding = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
reqwest = { version = "0.13", features = ["json"] }
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
# Resolves the "system" language choice for the tray menu.
sys-locale = "0.3"

# The default TLS backend (rustls-platform-verifier) needs a Java companion
# class and an initialized android context, and the default rustls provider
# (aws-lc-rs) fights the NDK cross-compile. Bundled webpki roots over ring
# avoid both — see `net::http_builder`.
[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "charset",
  "http2",
  "rustls-no-provider",
] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2.4"

# The effective uid is the one root check that holds on every Unix we ship to:
# macOS has no /proc to probe, and `$EUID` is a bash-internal variable that a
# child process never sees.
[target.'cfg(all(unix, not(target_os = "android")))'.dependencies]
libc = "0.2"

# The one-time «grant root to the core» and the in-app update both need a
# privileged shell. NSAppleScript's `do shell script … with administrator
# privileges` is Apple's supported door for an app without a signed helper,
# and run in-process it shows the system password dialog in the app's own
# name rather than as «osascript». Same versions as the tauri stack.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
  "NSAppleScript",
  "NSAppleEventDescriptor",
  "NSDictionary",
  "NSString",
  "NSValue",
] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
# Same versions as the wry/tauri stack, so the COM types are shared — used to
# put WebView2 into its Low memory-usage mode, which tauri does not expose.
webview2-com = "0.38"
windows-core = "0.61"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Networking_WinInet",
  "Win32_System_Com",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
] }

[features]
# Enabled by `tauri build --debug`; keeps devtools available in release builds.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
