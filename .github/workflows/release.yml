name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            artifact: windows-x64
          - os: ubuntu-latest
            bundles: deb,rpm,appimage
            artifact: linux-x64
          - os: macos-latest
            bundles: dmg
            target: aarch64-apple-darwin
            core: darwin-arm64
            artifact: macos-arm64
          - os: macos-latest
            bundles: dmg
            target: x86_64-apple-darwin
            core: darwin-x64
            artifact: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libgtk-3-dev libxdo-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Add cross-compilation target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Fetch core binaries
        run: npm run fetch-core
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CORE_TARGET: ${{ matrix.core }}

      - name: Build installer
        shell: bash
        run: |
          ARGS="--bundles ${{ matrix.bundles }}"
          if [ -n "${{ matrix.target }}" ]; then
            ARGS="$ARGS --target ${{ matrix.target }}"
          fi
          npm run tauri build -- $ARGS

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p upload
          find src-tauri/target -path '*/bundle/*' \
            \( -name '*-setup.exe' -o -name '*.deb' -o -name '*.rpm' \
               -o -name '*.AppImage' -o -name '*.dmg' \) \
            -exec cp {} upload/ \;
          ls -la upload

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: upload/*
          if-no-files-found: error

  # A single job publishes everything at once, so four parallel uploads never
  # race each other creating the release.
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # The in-app updater looks for the `*-setup.exe` / `*.dmg` / `*.AppImage`
      # assets of the latest release, so the names must keep those suffixes.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
