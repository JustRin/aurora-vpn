<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aurora VPN — open-source VLESS client</title>
<meta name="description" content="Open-source VPN client for VLESS, VMess, Trojan, Shadowsocks, Hysteria2 and TUIC servers, powered by sing-box. TUN mode, split tunneling, rule-based routing. Works with any panel (3x-ui, Marzban, …). Windows, Android, Linux, macOS.">
<style>
  :root {
    --bg: #0a0c12;
    --panel: rgba(20, 24, 36, 0.66);
    --border: rgba(90, 106, 150, 0.22);
    --text: #e7eaf3;
    --text-dim: #a2aac2;
    --text-muted: #6f7893;
    --accent: #7c3aed;
    --accent-hi: #8b5cf6;
    --accent-soft: rgba(124, 58, 237, 0.16);
    --accent-text: #c4b5fd;
    --sheen: rgba(255, 255, 255, 0.06);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.6 "Segoe UI", system-ui, -apple-system, sans-serif;
    overflow-x: hidden;
  }
  /* Arabic needs a face that actually carries the glyphs — the latin stack
     above degrades into a ransom note on several systems. */
  html[dir="rtl"] body {
    font-family: "Segoe UI", "Noto Naskh Arabic", "Geeza Pro", "Traditional Arabic", system-ui, sans-serif;
  }
  /* The app's ambient layer: three soft drifting glows. */
  .ambient {
    position: fixed;
    inset: -25%;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(38% 30% at 22% 19%, rgba(124, 58, 237, 0.20), transparent 70%),
      radial-gradient(32% 28% at 78% 12%, rgba(34, 211, 238, 0.10), transparent 70%),
      radial-gradient(40% 34% at 62% 86%, rgba(124, 58, 237, 0.12), transparent 70%);
    animation: drift 60s ease-in-out infinite alternate;
  }
  @keyframes drift {
    to { transform: translate3d(2%, -2%, 0) scale(1.04); }
  }
  @media (prefers-reduced-motion: reduce) { .ambient { animation: none; } }

  .wrap { position: relative; z-index: 1; max-width: 980px; margin: 0 auto; padding: 0 22px 80px; }

  /* Logical inset, so the picker jumps to the other edge under dir="rtl". */
  .lang-switch {
    position: absolute; top: 18px; inset-inline-end: 22px;
    border: 1px solid var(--border); border-radius: 999px;
    background: var(--panel); backdrop-filter: blur(14px) saturate(140%);
  }
  .lang-switch::after {
    content: ""; position: absolute; inset-inline-end: 13px; top: 50%;
    width: 7px; height: 7px; margin-top: -5px; pointer-events: none;
    border-right: 1.6px solid var(--text-muted);
    border-bottom: 1.6px solid var(--text-muted);
    transform: rotate(45deg);
  }
  .lang-switch select {
    appearance: none; -webkit-appearance: none;
    border: 0; background: transparent; color: var(--accent-text);
    font: 600 12.5px/1 inherit; cursor: pointer; border-radius: 999px;
    padding-block: 9px; padding-inline: 14px 30px;
  }
  .lang-switch select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* The native dropdown ignores the transparent parent, so paint it here. */
  .lang-switch option { background: #141824; color: var(--text); }

  header { padding: 84px 0 30px; text-align: center; }
  .logo {
    display: inline-flex; align-items: center; gap: 14px;
    font-size: 44px; font-weight: 800; letter-spacing: -1px;
  }
  .logo .orb {
    width: 46px; height: 46px; border-radius: 50%;
    background: radial-gradient(circle at 32% 30%, var(--accent-hi), var(--accent) 55%, #4c1d95);
    box-shadow: 0 0 34px rgba(124, 58, 237, 0.55);
  }
  .tagline { margin-top: 14px; font-size: 19px; color: var(--text-dim); }
  .tagline-sub { margin-top: 6px; font-size: 14px; color: var(--text-muted); }

  .cta { margin: 34px 0 8px; display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  .btn {
    display: inline-flex; align-items: center; gap: 9px;
    padding: 12px 22px; border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text); text-decoration: none; font-weight: 600; font-size: 15px;
    box-shadow: inset 0 1px 0 var(--sheen);
    transition: border-color .15s ease, background .15s ease, transform .1s ease;
  }
  .btn:hover { border-color: var(--accent); background: var(--accent-soft); transform: translateY(-1px); }
  .btn.primary {
    background: linear-gradient(135deg, var(--accent-hi), var(--accent));
    border-color: transparent; color: #fff;
    box-shadow: 0 6px 26px rgba(124, 58, 237, 0.35);
  }
  .btn.primary:hover { background: linear-gradient(135deg, #9d74f8, var(--accent-hi)); }
  /* Platform names and the version tag are latin: keep them running
     left-to-right even while the page around them is flipped. */
  html[dir="rtl"] .btn { direction: ltr; }
  html[dir="rtl"] .btn.primary { direction: rtl; }
  html[dir="rtl"] #ver { direction: ltr; unicode-bidi: isolate; }
  .note { text-align: center; color: var(--text-muted); font-size: 13.5px; margin-top: 14px; }
  .note a { color: var(--accent-text); }

  .grid { margin-top: 58px; display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 14px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px 22px;
    box-shadow: inset 0 1px 0 var(--sheen);
    backdrop-filter: blur(14px) saturate(140%);
  }
  .card h3 { font-size: 15.5px; margin-bottom: 8px; color: var(--accent-text); }
  .card p { font-size: 14px; color: var(--text-dim); }
  .card code { font-family: Consolas, ui-monospace, monospace; font-size: 12.5px; color: var(--text); }

  .open { margin-top: 58px; text-align: center; color: var(--text-dim); font-size: 15px; }
  .open a { color: var(--accent-text); }

  footer { margin-top: 66px; text-align: center; color: var(--text-muted); font-size: 13px; }
  footer a { color: var(--text-dim); }
</style>
</head>

  <footer id="footer-line"></footer>
</div>

  // Arabic is the only right-to-left locale here.
  const RTL = new Set(["ar"]);

  // navigator.language hands out full tags ("pt-BR", "zh-Hans-CN"), so the
  // match runs on the primary subtag alone: every Chinese variant lands on
  // zh-CN, every Portuguese one on pt.
  const BY_PRIMARY = { en: "en", ru: "ru", zh: "zh-CN", ja: "ja", ko: "ko", ar: "ar", pt: "pt" };

  function setLang(lang) {
    if (!I18N[lang]) lang = "en";
    const dict = I18N[lang];
    document.documentElement.lang = lang;
    document.documentElement.dir = RTL.has(lang) ? "rtl" : "ltr";
    for (const el of document.querySelectorAll("[data-i18n]")) {
      el.textContent = dict[el.dataset.i18n] || "";
    }
    // The two rich-text blocks carry markup, so they are set as HTML from the
    // dictionaries above (static strings, nothing user-supplied).
    document.getElementById("open-line").innerHTML = dict.open;
    document.getElementById("footer-line").innerHTML = dict.footer;
    document.getElementById("lang-select").value = lang;
    try { localStorage.setItem("lang", lang); } catch {}
  }

  function detectLang() {
    const tags = navigator.languages && navigator.languages.length
      ? navigator.languages
      : [navigator.language || ""];
    for (const tag of tags) {
      const hit = BY_PRIMARY[String(tag).toLowerCase().split("-")[0]];
      if (hit) return hit;
    }
    return "en";
  }

  let saved = null;
  try { saved = localStorage.getItem("lang"); } catch {}
  setLang(saved && I18N[saved] ? saved : detectLang());

  // Cosmetic: show the latest version on the download button when the API allows.
  fetch("https://api.github.com/repos/JustRin/aurora-vpn/releases/latest")
    .then(r => r.ok ? r.json() : null)
    .then(release => {
      if (release && release.tag_name) {
        document.getElementById("ver").textContent = " " + release.tag_name;
      }
    })
    .catch(() => {});
